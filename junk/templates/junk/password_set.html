{% extends 'junk/base.html' %}
{% block title %}Set a password{% endblock %}
{% block body_class %}jr-auth{% endblock %}

{% block body %}
<main class="jr-auth-wrap">
  <form class="jr-auth-card jr-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Set a password</h1>
    <p class="jr-auth-sub">For {{ user.email }}. Google sign-in keeps working too.</p>
    {% if error %}<p class="jr-auth-error" role="alert">{{ error }}</p>{% endif %}
    <input type="email" name="username" value="{{ user.email }}" autocomplete="username" hidden>
    <div class="jr-field">
      <label for="jr-password">New password</label>
      <input id="jr-password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
    </div>
    <div class="jr-field">
      <label for="jr-confirm">Confirm password</label>
      <input id="jr-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="jr-btn jr-btn--primary jr-btn--block">Save and sign in</button>
  </form>
</main>
{% endblock %}
