{% extends 'junk/base.html' %}
{% block title %}Sign in{% endblock %}
{% block body_class %}jr-auth{% endblock %}

{% block body %}
<main class="jr-auth-wrap">
  <form class="jr-auth-card jr-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Sign in</h1>
    {% if error %}<p class="jr-auth-error" role="alert">{{ error }}</p>{% endif %}
    <div class="jr-field">
      <label for="jr-email">Email</label>
      <input id="jr-email" name="email" type="email" autocomplete="email" value="{{ email }}" required {{ 'autofocus' if not email }}>
    </div>
    <div class="jr-field">
      <label for="jr-password">Password</label>
      <input id="jr-password" name="password" type="password" autocomplete="current-password" required {{ 'autofocus' if email }}>
    </div>
    <button type="submit" class="jr-btn jr-btn--primary jr-btn--block">Sign in</button>
  </form>
</main>
{% endblock %}
