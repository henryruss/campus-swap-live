{# The photo viewer (crew.js): one photo at a time over the page. Arrows (and the arrow keys)
   on a computer, swipe on a phone; neither when there's only one. #}
<div class="jr-pv" role="dialog" aria-modal="true" aria-label="Photo" hidden data-pv>
  <button type="button" class="jr-pv-close" aria-label="Close" data-pv-close>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button type="button" class="jr-pv-nav jr-pv-prev" aria-label="Previous photo" data-pv-step="-1">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
  <figure class="jr-pv-fig" data-pv-fig><img alt="" data-pv-img></figure>
  <button type="button" class="jr-pv-nav jr-pv-next" aria-label="Next photo" data-pv-step="1">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
  <p class="jr-pv-count" data-pv-count></p>
</div>
